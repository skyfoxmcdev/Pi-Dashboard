name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate
        run: |
          python -m compileall -q backend tests
          python -m unittest discover -s tests -v
          bash -n deploy/install.sh deploy/uninstall.sh \
            deploy/kiosk/launch-kiosk.sh deploy/kiosk/pi-dashboard-kiosk \
            deploy/update/pi-dashboard-update

      - name: Verify tag and build archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python - "$VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          expected = sys.argv[1]
          text = Path("backend/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', text, re.MULTILINE)
          if not match:
              raise SystemExit("version introuvable dans backend/__init__.py")
          actual = match.group(1)
          if actual != expected:
              raise SystemExit(f"tag {expected} != version {actual}")
          print(f"Version validée : {actual}")
          PY
          git archive \
            --format=tar.gz \
            --prefix="pi-dashboard-${VERSION}/" \
            -o "pi-dashboard-${VERSION}.tar.gz" \
            HEAD
          sha256sum "pi-dashboard-${VERSION}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "pi-dashboard-${VERSION}.tar.gz" \
            "SHA256SUMS" \
            --title "Pi Dashboard ${VERSION}" \
            --generate-notes
